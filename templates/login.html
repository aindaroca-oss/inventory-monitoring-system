<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Dunder Mifflin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='inventory-login-6') }}">
</head>
<body class="login-body">
  <main class="login-layout">
    <section class="brand-panel"><img class="brand-mark" src="{{ url_for('static', filename='images/Dunder_Mifflin_Logo1.png') }}" alt="Dunder Mifflin Paper Company"><div class="brand-lines"></div></section>
    <section class="login-side">
      <form class="login-card" id="login-form-personnel" data-login-panel="personnel" method="post" action="{{ url_for('login') }}" {% if login_role != 'personnel' %}hidden{% endif %}>
        <h1>Staff Sign In</h1>
        {% if login_error and login_role=='personnel' %}<div class="notice error">{{ login_error }}</div>{% endif %}
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <input type="hidden" name="role" value="personnel">
        <div class="role-preview"><button type="button" class="{{ 'active' if login_role == 'personnel' else '' }}" data-login-role="personnel">Staff</button><button type="button" data-login-role="admin">Admin</button></div>
        <label>Email <b>*</b><input name="email" type="email" value="{{ login_email if login_role=='personnel' else '' }}" autocomplete="username" placeholder="Enter work email" required></label>
        <label>Password <b>*</b><span class="password-wrap"><input name="password" id="login-password-personnel" class="password-masked" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="button" class="eye-button" data-toggle-password="login-password-personnel" aria-label="Show password" aria-pressed="false"><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3 21 21"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"></path></svg><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <label class="check-label"><input type="checkbox" name="remember" checked> <span>Remember me</span></label>
        <button class="button primary full" type="submit">Log in</button>
        <p class="login-foot">Bulacan Branch</p>
      </form>
      <form class="login-card" id="login-form-admin" data-login-panel="admin" method="post" action="{{ url_for('login') }}" {% if login_role != 'admin' %}hidden{% endif %}>
        <h1>Admin Sign In</h1>
        {% if login_error and login_role=='admin' %}<div class="notice error">{{ login_error }}</div>{% endif %}
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <input type="hidden" name="role" value="admin">
        <div class="role-preview"><button type="button" data-login-role="personnel">Staff</button><button type="button" class="{{ 'active' if login_role == 'admin' else '' }}" data-login-role="admin">Admin</button></div>
        <label>Email <b>*</b><input name="email" type="email" value="{{ login_email if login_role=='admin' else '' }}" autocomplete="username" placeholder="Enter work email" required></label>
        <label>Password <b>*</b><span class="password-wrap"><input name="password" id="login-password-admin" class="password-masked" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="button" class="eye-button" data-toggle-password="login-password-admin" aria-label="Show password" aria-pressed="false"><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3 21 21"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"></path></svg><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <label class="check-label"><input type="checkbox" name="remember" checked> <span>Remember me</span></label>
        <button class="button primary full" type="submit">Log in</button>
        <p class="login-foot">Bulacan Branch</p>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js', v='login-remember-7') }}" defer></script>
</body>
</html>
